<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorouk Business Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sheet">
  <div class="banner"><img src="img/academy.jpg" alt="أكاديمية الشروق">
    <div class="brand" dir="ltr">Shorouk Business Hub</div>
    <svg viewBox="0 0 800 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C120 0 220 55 360 30 S620 5 800 35 V60 H0Z" fill="rgba(255,255,255,.16)"/></svg>
  </div>
  <div class="av"><img id="pic" src="img/mostafa.jpg" alt="مصطفى عيسى محمد"></div>
  <div class="id">
    <h1 dir="ltr">Mostafa Eisa Mohamed Hassan</h1>
    <p class="role" dir="ltr">Founder &amp; Owner</p>
    <p class="sub" dir="ltr">An Education Platform by Mostafa Eisa</p>
  </div>

  <section class="card">
    <h2>المواد</h2>
    <p class="hint">دوس على أي مادة تفتحلك سكاشنها</p>
    <div class="pills" id="pills"></div>
    <div class="tp"><span>تقدمك الكلي</span><b id="tp">0%</b></div>
    <div class="bar"><i id="tb"></i></div>
  </section>

  <section class="card">
    <h2>متابعة المذاكرة</h2>
    <div class="grid" id="g"></div>
  </section>
  <footer dir="ltr">© Shorouk Business Hub · Mostafa Eisa</footer>
</div>
<div id="lb" hidden onclick="this.hidden=true"><img id="lbi" alt="شرح Section 2"><span>اضغط في أي مكان للإغلاق</span></div>
<script src="main.js"></script>
</body>
</html>
